name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours for fresher graph
  workflow_dispatch:
  push:
    branches:
      - main

# prevent overlapping runs
concurrency:
  group: snake-animation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate multiple high-visibility variants
      - name: Generate snake assets
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Light mode: stronger low-cell visibility
            dist/github-snake.svg?color_snake=#FF2E97&color_dots=#EBEDF0,#C6F6D5,#7EE787,#2EA043,#116329

            # Dark mode: neon contrast so snake never blends in
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

            # Stylish alt theme (purple neon)
            dist/github-snake-neon.svg?color_snake=#B300FF&color_dots=#1F2430,#33415C,#5C7AEA,#8E9BFF,#C0C6FF

            # Optional animated gif for extra visual impact
            dist/github-snake.gif?color_snake=#FF2E97&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake assets to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "chore: update snake animation [skip ci]"
