name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: snake-animation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake assets (high contrast + stylish)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # LIGHT: very visible low cells + hot pink snake with border
            dist/github-snake.svg?color_snake=#FF007A&color_snake_border=#FFFFFF&color_dots=#F2F2F2,#D9F99D,#86EFAC,#22C55E,#15803D

            # DARK: black empty cells + visible outlines + green activity levels
            dist/github-snake-dark.svg?color_snake=#00E5FF&color_snake_border=#0D0221&color_dots=#0D1117,#B7F7D0,#70E1A0,#2FAF70,#146B45

            # STYLISH ALT: purple-electric theme (different from usual)
            dist/github-snake-electric.svg?color_snake=#C800FF&color_snake_border=#FFFFFF&color_dots=#EEF2FF,#C4B5FD,#A78BFA,#7C3AED,#4C1D95

            # Optional GIF version
            dist/github-snake.gif?color_snake=#FF007A&color_snake_border=#FFFFFF&color_dots=#1F2937,#A7F3D0,#6EE7B7,#34D399,#059669
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make dark snake cell borders visible
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dist/github-snake-dark.svg")
          content = path.read_text(encoding="utf-8")
          content, replacements = re.subn(r"--cb:#[0-9A-Fa-f]{6,8}", "--cb:#3D4656", content, count=1)
          if replacements != 1:
              raise SystemExit("Could not find the dark snake cell border color")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Push snake assets to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "chore: update snake animation [skip ci]"
