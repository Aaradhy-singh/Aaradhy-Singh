name: Activity Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activity_graph.py"
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Aaradhy-singh
        run: python scripts/activity_graph.py

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git diff --cached --quiet || git commit -m "chore: update activity graph"
          git push
