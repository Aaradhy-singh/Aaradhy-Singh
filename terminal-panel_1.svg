  <style>
    .key   { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #22D3EE; font-weight: bold; }
    .cc    { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #475569; }
    .value { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #F8FAFC; }
    .accent{ font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #A78BFA; font-weight: bold; }
    .head  { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #F8FAFC; font-weight: bold; }
    .prompt{ font-family: 'Courier New', Consolas, monospace; font-size: 14px; fill: #94A3B8; }
